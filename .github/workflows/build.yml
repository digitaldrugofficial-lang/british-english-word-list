name: Build word list

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the latest LetterCracker word list
        run: |
          curl -fsSL -A "Mozilla/5.0 (compatible; word-list-build)" \
            https://lettercracker.co.uk/wp-content/uploads/2026/10/lettercracker-uk-words-v2.txt \
            | tr -d '\r' | grep -E '^[A-Z]{3,15}$' > words.txt
          test "$(wc -l < words.txt)" -gt 50000
          rm -rf by-length && mkdir by-length
          awk '{ f = sprintf("by-length/%02d-letter-words.txt", length($0)); print > f }' words.txt
          wc -l words.txt by-length/*.txt
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add words.txt by-length
          git diff --cached --quiet || git commit -m "Update word list from lettercracker.co.uk"
          git push
